[package]
name = "yenc-simd"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Fast yEnc encoder/decoder with SIMD acceleration (SSE2/AVX2)"
repository = "https://github.com/TheDancingDeveloper-org/rust-yenc-simd"
readme = "README.md"
keywords = ["yenc", "usenet", "nntp", "simd", "decode"]
categories = ["encoding", "parser-implementations"]

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused = "warn"

[dependencies]
crc32fast = "1"
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "decode"
harness = false
